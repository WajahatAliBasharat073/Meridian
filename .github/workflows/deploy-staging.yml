name: Deploy Staging

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: staging
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Staging Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            api/requirements-dev.txt
            api/requirements.lock

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Backend checks
        working-directory: api
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt -r requirements-dev.txt
          ruff check .
          mypy app scripts
          pytest -q --cov=app --cov-report=term-missing

      - name: Frontend checks
        working-directory: web
        env:
          API_BASE_URL: http://localhost:8000
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm run build

      - name: Build API image
        run: docker build -f api/Dockerfile api

      - name: Validate Docker Compose config
        run: docker compose config --quiet

  deploy:
    name: Deploy to Staging
    needs: quality-gate
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ vars.APP_URL }}
    env:
      DEPLOY_ENABLED: ${{ vars.DEPLOY_ENABLED }}
      APP_URL: ${{ vars.APP_URL }}
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      WEB_DEPLOY_TOKEN_SET: ${{ secrets.WEB_DEPLOY_TOKEN != '' }}
      API_DEPLOY_TOKEN_SET: ${{ secrets.API_DEPLOY_TOKEN != '' }}
      DATABASE_URL_SET: ${{ secrets.DATABASE_URL != '' }}
      SUPABASE_JWT_SECRET_SET: ${{ secrets.SUPABASE_JWT_SECRET != '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Deployment not configured
        if: env.DEPLOY_ENABLED != 'true'
        run: |
          echo "Staging deployment is disabled."
          echo "Set DEPLOY_ENABLED=true in the staging environment after provider-specific commands are wired."

      - name: Validate deployment configuration
        if: env.DEPLOY_ENABLED == 'true'
        run: |
          missing=0
          for name in APP_URL API_BASE_URL; do
            if [ -z "${!name}" ]; then
              echo "$name environment variable is required." >&2
              missing=1
            fi
          done

          for name in WEB_DEPLOY_TOKEN_SET API_DEPLOY_TOKEN_SET DATABASE_URL_SET SUPABASE_JWT_SECRET_SET; do
            if [ "${!name}" != "true" ]; then
              echo "${name%_SET} environment secret is required." >&2
              missing=1
            fi
          done

          exit "$missing"

      - name: Provider deployment hook
        if: env.DEPLOY_ENABLED == 'true'
        run: |
          echo "Provider-specific staging deployment is not wired yet." >&2
          echo "Add the selected host commands here, or call a checked-in deployment script." >&2
          exit 1

      - name: Smoke test web
        if: env.DEPLOY_ENABLED == 'true'
        run: curl --fail --show-error --silent "$APP_URL"

      - name: Smoke test API
        if: env.DEPLOY_ENABLED == 'true'
        run: curl --fail --show-error --silent "$API_BASE_URL/health"
