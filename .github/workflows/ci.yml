name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Recreate venv from scratch
        run: |
          rm -rf .venv
          python -m venv .venv
          source .venv/bin/activate
          which python
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: source .venv/bin/activate && ruff check .

      - name: Typecheck
        run: source .venv/bin/activate && mypy app

      - name: Test
        run: source .venv/bin/activate && pytest -q --cov=app --cov-report=term-missing

  # The web job is added back once web/ has a package.json to build against
  # (build prompt delivery order: engines + Today view before polish) — an
  # empty frontend job would just be a permanently red pipeline.
