name: Release & Deployment

on:
  push:
    branches: [develop, staging, qa, uat, main]
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      target_environment:
        description: Deployment environment
        required: true
        type: choice
        options:
          - dev-sandbox
          - staging
          - qa
          - uat
          - production
      confirm_production:
        description: Type deploy-production when target_environment is production
        required: false
        type: string

permissions:
  contents: read
  deployments: write

concurrency:
  group: cd-${{ github.event_name == 'workflow_dispatch' && inputs.target_environment || github.ref_name }}
  cancel-in-progress: false

jobs:
  select-environment:
    name: Resolve Target Environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.select.outputs.environment }}
    steps:
      - id: select
        name: Map branch or manual input
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            environment="${{ inputs.target_environment }}"
            if [ "$environment" = "production" ] && [ "${{ inputs.confirm_production }}" != "deploy-production" ]; then
              echo "Production deploys require confirm_production=deploy-production." >&2
              exit 1
            fi
          else
            case "${GITHUB_REF}" in
              refs/heads/develop) environment="dev-sandbox" ;;
              refs/heads/staging) environment="staging" ;;
              refs/heads/qa) environment="qa" ;;
              refs/heads/uat) environment="uat" ;;
              refs/heads/main|refs/tags/v*) environment="production" ;;
              *)
                echo "No deployment environment mapped for ${GITHUB_REF}." >&2
                exit 1
                ;;
            esac
          fi

          echo "environment=$environment" >> "$GITHUB_OUTPUT"

  quality-gate:
    name: Release Quality Gate
    needs: select-environment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            api/requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: API checks
        working-directory: api
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt -r requirements-dev.txt
          ruff check .
          mypy app scripts
          pytest -q --cov=app --cov-report=term-missing

      - name: Web checks
        working-directory: web
        env:
          API_BASE_URL: http://localhost:8000
          API_DEV_TOKEN: ""
        run: |
          npm ci
          npm run lint
          npm run build

  deploy:
    name: Deploy to Environment
    needs: [select-environment, quality-gate]
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.select-environment.outputs.environment }}
      url: ${{ vars.APP_URL }}
    env:
      TARGET_ENVIRONMENT: ${{ needs.select-environment.outputs.environment }}
      DEPLOY_ENABLED: ${{ vars.DEPLOY_ENABLED }}
      APP_URL: ${{ vars.APP_URL }}
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      WEB_DEPLOY_TOKEN_SET: ${{ secrets.WEB_DEPLOY_TOKEN != '' }}
      API_DEPLOY_TOKEN_SET: ${{ secrets.API_DEPLOY_TOKEN != '' }}
      DATABASE_URL_SET: ${{ secrets.DATABASE_URL != '' }}
      SUPABASE_JWT_SECRET_SET: ${{ secrets.SUPABASE_JWT_SECRET != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate environment configuration
        run: |
          missing=0

          if [ -z "$APP_URL" ]; then
            echo "APP_URL environment variable is required." >&2
            missing=1
          fi

          if [ -z "$API_BASE_URL" ]; then
            echo "API_BASE_URL environment variable is required." >&2
            missing=1
          fi

          if [ "$WEB_DEPLOY_TOKEN_SET" != "true" ]; then
            echo "WEB_DEPLOY_TOKEN environment secret is required." >&2
            missing=1
          fi

          if [ "$API_DEPLOY_TOKEN_SET" != "true" ]; then
            echo "API_DEPLOY_TOKEN environment secret is required." >&2
            missing=1
          fi

          if [ "$DATABASE_URL_SET" != "true" ]; then
            echo "DATABASE_URL environment secret is required." >&2
            missing=1
          fi

          if [ "$SUPABASE_JWT_SECRET_SET" != "true" ]; then
            echo "SUPABASE_JWT_SECRET environment secret is required." >&2
            missing=1
          fi

          exit "$missing"

      - name: Deployment provider hook
        if: env.DEPLOY_ENABLED == 'true'
        run: |
          echo "Deploying ${TARGET_ENVIRONMENT}."
          echo "Provider-specific deployment commands are not wired yet." >&2
          echo "Examples: Vercel for web, Render/Railway/Fly/AWS for API, Supabase migration job for DB." >&2
          exit 1

      - name: Deployment disabled
        if: env.DEPLOY_ENABLED != 'true'
        run: |
          echo "CD checks passed for ${TARGET_ENVIRONMENT}."
          echo "Set DEPLOY_ENABLED=true on the GitHub environment after provider-specific deploy commands are added."
